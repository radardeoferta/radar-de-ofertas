name: Buffer

on:
  push:
    paths:
      - "buffer.py"
  schedule:
    - cron: "15 12 * * *"   # todo dia 9h15 (Brasilia): agenda no Buffer o que tiver vaga
  workflow_dispatch:
    inputs:
      acao:
        description: "teste, descobrir ou agendar"
        default: "agendar"

permissions:
  contents: write

concurrency: radar

jobs:
  buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buffer
        run: |
          ACAO="${{ github.event.inputs.acao }}"
          if [ -z "$ACAO" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then ACAO=agendar; else ACAO=teste; fi
          fi
          python3 buffer.py "$ACAO"
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}

      - name: Salvar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "Radar: Buffer atualizado" && git pull --rebase && git push)
