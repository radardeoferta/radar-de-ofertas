name: Gerar carrosseis

on:
  push:
    paths:
      - "series.txt"
      - "fotos/**"
      - "produtos/**"
      - "carrossel.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: radar

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar gerador de imagens
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Gerar carrosseis
        run: python3 carrossel.py

      - name: Salvar imagens
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Radar: carrosseis atualizados" && git pull --rebase && git push)
