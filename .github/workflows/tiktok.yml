name: TikTok

# PAUSADO em 13/11/2026: o TikTok virou a conta Giu Indica (@giustuart.indica).
# Nao agenda mais posts da Nina. Roda so quando este arquivo ou o tiktok.py mudam, e so cancela.
on:
  push:
    paths:
      - "tiktok.py"
      - ".github/workflows/tiktok.yml"
  workflow_dispatch:
    inputs:
      acao:
        description: "cancelar, teste ou agendar"
        default: "cancelar"

permissions:
  contents: write

concurrency: radar

jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agendar no TikTok
        run: |
          ACAO="${{ github.event.inputs.acao }}"
          set -o pipefail
          { python3 tiktok.py "${ACAO:-cancelar}"; } 2>&1 | tee data/tiktok_log.txt
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}

      - name: Salvar
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data tiktok_agora.txt
          git diff --staged --quiet || (git commit -m "Radar: TikTok atualizado" && git pull --rebase && git push)
