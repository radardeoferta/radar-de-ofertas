name: Radar de Ofertas

on:
  schedule:
    # 11h, 15h, 19h e 21h no horario de Brasilia (UTC-3)
    - cron: "0 14,18,22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # botao "Run workflow" para postar na hora

permissions:
  contents: write

concurrency: radar

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Postar oferta no Telegram e atualizar vitrine
        run: python3 radar.py postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: "@radardeoferta"

      - name: Salvar historico e vitrine
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || (git commit -m "Radar: atualizacao automatica" && git push)
